name: Supabase keep-alive

on:
  schedule:
    - cron: "0 6 * * 1,4" # mandag og torsdag kl. 06 (UTC)
  workflow_dispatch: # gør det muligt at køre den manuelt

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # VITE_SUPABASE_URL ender på /rest/v1, så tabellen /posts tilføjes her
      - name: Ping Supabase
        run: |
          curl --fail -sS -o /dev/null \
            "${{ vars.VITE_SUPABASE_URL }}/posts?select=id&limit=1" \
            -H "apikey: ${{ vars.VITE_SUPABASE_APIKEY }}"
